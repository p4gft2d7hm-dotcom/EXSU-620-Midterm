<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#477083"/></marker></defs><rect x="20" y="140" width="170" height="80" rx="9" fill="#e7f3e9" stroke="#28627a" stroke-width="1.5"/><text x="105" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#183040"><tspan x="105" dy="0">NORMAL</tspan><tspan x="105" dy="21">Green / silent</tspan></text><rect x="280" y="140" width="190" height="80" rx="9" fill="#fff1d2" stroke="#28627a" stroke-width="1.5"/><text x="375" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#183040"><tspan x="375" dy="0">ADVISORY</tspan><tspan x="375" dy="21">Amber / 3 pulses</tspan></text><rect x="580" y="140" width="220" height="80" rx="9" fill="#ffe9e4" stroke="#28627a" stroke-width="1.5"/><text x="690" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#183040"><tspan x="690" dy="0">CRITICAL sounding</tspan><tspan x="690" dy="21">Red / 10 pulses</tspan></text><rect x="870" y="40" width="220" height="80" rx="9" fill="#ffe9e4" stroke="#28627a" stroke-width="1.5"/><text x="980" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#183040"><tspan x="980" dy="0">CRITICAL muted</tspan><tspan x="980" dy="21">Acknowledged</tspan></text><rect x="870" y="270" width="220" height="80" rx="9" fill="#ffe9e4" stroke="#28627a" stroke-width="1.5"/><text x="980" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#183040"><tspan x="980" dy="0">CRITICAL sounding</tspan><tspan x="980" dy="21">Turn recorded</tspan></text><path d="M190,175 L280,175" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="235" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#183040"><tspan x="235" dy="0">&lt;=900 s</tspan></text><path d="M470,175 L580,175" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="525" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#183040"><tspan x="525" dy="0">&lt;=0 s</tspan></text><path d="M800,160 L870,100" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="835" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#183040"><tspan x="835" dy="0">ack</tspan></text><path d="M800,210 L870,290" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="835" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#183040"><tspan x="835" dy="0">turn</tspan></text><path d="M980,40 L980,12 L105,12 L105,140" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="520" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#183040"><tspan x="520" dy="0">Qualifying turn after acknowledgement -&gt; clear</tspan></text><path d="M980,350 L980,390 L105,390 L105,220" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="500" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#183040"><tspan x="500" dy="0">Acknowledgement after qualifying turn -&gt; clear</tspan></text><path d="M375,140 L375,85 L105,85 L105,140" fill="none" stroke="#477083" stroke-width="2" marker-end="url(#a)"/><text x="240" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#183040"><tspan x="240" dy="0">Accepted turn resets advisory</tspan></text><rect x="180" y="445" width="760" height="85" rx="9" fill="#e1f5f7" stroke="#28627a" stroke-width="1.5"/><text x="560" y="482.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#183040"><tspan x="560" dy="0">Independent technical flag: invalid / still persists for 5 s -&gt; cyan / chirp</tspan><tspan x="560" dy="21">Fault clears -&gt; normal alarm display resumes; critical outranks technical.</tspan></text><text x="560" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#183040"><tspan x="560" dy="0">Normal can also enter critical directly when an update crosses both time thresholds.</tspan></text></svg>